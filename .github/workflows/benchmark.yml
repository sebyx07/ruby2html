name: Benchmarks

# Non-gating (not part of "CI OK"), but a crashing benchmark fails the job.
# Each run renders a Markdown table into the job summary and uploads the raw
# JSON (bench-<arch>). On PRs the table gets a delta column against the latest
# successful main run and is posted as one sticky comment per architecture
# (skipped for fork PRs, whose token cannot comment).
#
# Runner: GitHub-hosted runners are noisy (expect a few % run-to-run). For
# stable numbers set the repository variable BENCH_RUNNER to a self-hosted
# runner label; it then replaces the per-arch runners below.
#
# Runs only when something a benchmark measures changed (the gem, the C and
# Java extensions, the bench scripts, the demo app's benchmark routes and
# views, the bundle, the Ruby pin): a docs or CI change has no numbers to move.
on:
  pull_request:
    paths: &bench-paths
      - 'lib/**'
      - 'ext/**'
      - 'bench/**'
      - 'bin/bench-report'
      - 'app/**'
      - 'config/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - '.github/workflows/benchmark.yml'
  push:
    branches: [main]
    paths: *bench-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A main run is the baseline pull requests compare against: never cancel it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks / ${{ matrix.arch }}
    runs-on: ${{ vars.BENCH_RUNNER || matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download the main-branch baseline artifact
      pull-requests: write # sticky PR comment
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      CI: '1'
      BENCH_TIME: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - run: bundle exec rake compile

      - name: Prepare the demo app database
        run: bin/rails db:prepare
        env:
          RAILS_ENV: test

      # bench/*.rb with the C extension and with RUBY2HTML_DISABLE_EXT=1, then
      # the Rails comparison (ERB, Slim, Phlex, ViewComponent + ruby2html,
      # .html.rb templates, Ruby2html::Component) over the /benchmark/* routes.
      - name: Run benchmarks
        run: bundle exec bin/bench-report run bench-results.json

      - name: Download main baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow benchmark.yml --branch main \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          # A missing or expired baseline artifact means "no delta", not a failure.
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "bench-$ARCH" -D baseline ||
              echo "No baseline artifact for $ARCH in run $run_id"
          else
            echo "No successful main run yet"
          fi

      - name: Render summary
        run: |
          args=(bench-results.json)
          [ -f baseline/bench-results.json ] && args+=(baseline/bench-results.json)
          ruby bin/bench-report markdown "${args[@]}" > bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.arch }}
          path: |
            bench-results.json
            bench.md
          retention-days: 90

      - name: Sticky PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: benchmarks-${{ matrix.arch }}
          path: bench.md
