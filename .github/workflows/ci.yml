name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: '1'

# Audited dependency sets: the committed root Gemfile.lock (job "audit") plus
# the sets the matrix jobs resolve from the unlocked gemfiles/standalone.gemfile
# and gemfiles/rails.gemfile. ruby/setup-ruby resolves those gemfiles during the
# job and writes the lockfile next to the gemfile (gemfiles/*.lock, gitignored,
# never committed); the audit of that lockfile rides on rake compile (rake
# audit:advisories -> bin/audit-advisories), the task every matrix entry
# already runs, so each entry audits the set it actually resolved, in the job
# that installed it.
# bundle-audit exits 1 on an advisory, so a finding fails the matrix entry and
# with it the aggregate "CI OK" job.
#
# Branch protection only needs to require the final "CI OK" check.
# Gems are cached by ruby/setup-ruby (bundler-cache), keyed on the lockfile or
# gemfile, Ruby version and OS.
jobs:
  lint:
    name: Lint / RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ruby2html/Gemfile
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        # setup-ruby reads version files only from the repo root; the root
        # .ruby-version is a symlink to apps/ruby2html/.ruby-version (the single
        # source of the dev Ruby version). A nested path here would be parsed as
        # an "engine-version" string and fail with "Unknown engine".
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: ../../bin/rubocop --parallel . ../../bin

  audit:
    name: Security / bundle-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: none
      - run: gem install --no-document bundler-audit
      - name: Check Gemfile.lock against the Ruby advisory database
        run: bundle-audit check --update

  test:
    name: Rails app / full suite + Brakeman
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ruby2html/Gemfile
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      # ubuntu runners ship gcc/make: no apt build-essential step needed.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rake compile
      - name: RSpec (features, gem, benchmarks)
        run: bundle exec rspec
      - name: Brakeman
        run: ../../bin/brakeman --no-pager

  ruby-versions:
    name: Matrix / Ruby versions
    # Every maintained CRuby (>= 3.1, the gemspec floor) from cache.ruby-lang.org; head is excluded
    # below (monthly in canary.yml), so new Ruby releases are tested automatically.
    uses: ruby/actions/.github/workflows/ruby_versions.yml@master
    with:
      engine: cruby
      min_version: 3.1

  gem-specs:
    name: Gem specs / Ruby ${{ matrix.ruby }}
    needs: ruby-versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.ruby-versions.outputs.versions) }}
        exclude:
          - ruby: head # monthly in canary.yml
    env:
      # No Rails and no lockfile: resolves on every Ruby, old and new.
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ruby2html/gemfiles/standalone.gemfile
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Compile + RSpec (spec/gem without Rails)
        run: bundle exec rake spec:standalone

  native:
    # x86_64 = SSE2 path, aarch64/arm64 = NEON path.
    name: C ext / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux arm64 (gcc), os: ubuntu-24.04-arm }
          - { name: macOS arm64 (clang), os: macos-latest }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ruby2html/Gemfile
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Compile + RSpec (spec/gem)
        run: bundle exec rake spec:gem
      - name: Packaged gem installs and renders
        run: bundle exec rake smoke

  strict-ext:
    name: C ext / ${{ matrix.cc }} -Werror
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ruby2html/Gemfile
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build with warnings as errors
        run: ../../bin/build-ext --cc=${{ matrix.cc }} --werror
      - name: RSpec (spec/gem) against that build
        run: bundle exec rake spec:gem
        env:
          SKIP_COMPILE: '1'

  sanitizers:
    name: C ext / ASAN + UBSAN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ruby2html/Gemfile
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build instrumented extension
        run: ../../bin/build-ext --sanitize
      - name: RSpec (spec/gem) with sanitizer runtimes preloaded
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
          export LD_PRELOAD
          bundle exec rspec spec/gem
        env:
          # use_sigaltstack=0: Ruby installs its own signal stack; ASAN's collides with it
          # ("failed to deallocate ... munmap") in a non-instrumented ruby.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1:use_sigaltstack=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  fallback:
    name: Pure Ruby fallback / RUBY2HTML_DISABLE_EXT=1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ruby2html/Gemfile
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: RSpec (spec/gem) without the C extension
        run: bundle exec rake spec:gem
        env:
          RUBY2HTML_DISABLE_EXT: '1'
          SKIP_COMPILE: '1'

  engines:
    name: Engine / ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: [jruby, truffleruby] # setup-ruby aliases for the latest releases
    env:
      # rspec + activesupport + htmlbeautifier only: no Rails, no sqlite3.
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ruby2html/gemfiles/standalone.gemfile
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # spec:standalone compiles first: on JRuby that builds the Java escaper
      # jar (ext/java), on TruffleRuby extconf.rb no-ops (pure Ruby is faster).
      - name: RSpec (spec/gem without Rails)
        run: bundle exec rake spec:standalone
      # On JRuby this builds and renders from the -java gem (jar inside); on
      # TruffleRuby the pure-Ruby gem.
      - name: Packaged gem installs and renders
        run: bundle exec ruby ../../bin/gem-smoke

  rails-versions:
    name: Matrix / Rails versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      - id: versions
        # Every stable Rails MAJOR.MINOR >= 7.2 (the demo app's floor), from rubygems.org.
        run: echo "versions=$(ruby ../../bin/rails-versions 7.2)" >> "$GITHUB_OUTPUT"

  rails:
    name: Rails ${{ matrix.rails }}
    needs: rails-versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rails: ${{ fromJSON(needs.rails-versions.outputs.versions) }} # edge: monthly in canary.yml
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ruby2html/gemfiles/rails.gemfile
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rake compile
      - name: Resolved versions
        run: bundle list | grep -E ' (rails|view_component|phlex-rails|rspec-rails|sqlite3) '
      - name: RSpec (integration specs)
        run: bundle exec rspec spec/features spec/gem/rails

  package:
    name: Package / build + install on Ruby ${{ matrix.ruby }}
    needs: ruby-versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.ruby-versions.outputs.versions) }}
        exclude:
          - ruby: head # monthly in canary.yml
    defaults:
      run:
        working-directory: apps/ruby2html
    steps:
      - uses: actions/checkout@v7
      # No Bundler on purpose: the gem must build and install with plain RubyGems.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: none
      - name: Build gem, install into temp GEM_HOME, render without Rails
        run: ruby ../../bin/gem-smoke

  ci-ok:
    name: CI OK
    if: always()
    # Every job here must pass; nothing is allowed to fail. Ruby head and Rails edge run monthly in
    # canary.yml, where the developerz.ai `improve` checkup picks up what they find.
    needs: [lint, audit, test, gem-specs, native, strict-ext, sanitizers, fallback, engines, rails, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No checkout and no working-directory here: it only aggregates results, and a
    # defaults working-directory with no checkout kills bash before the step starts
    # ("No such file or directory" for apps/ruby2html).
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "::error::A required job finished with '$r'"
              exit 1
            fi
          done
