name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request cancels the run it supersedes; a main run never cancels.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: '1'

# Audited dependency sets: the committed root Gemfile.lock (job "audit") plus
# the sets the matrix jobs resolve from the unlocked gemfiles/standalone.gemfile
# and gemfiles/rails.gemfile. ruby/setup-ruby resolves those gemfiles during the
# job and writes the lockfile next to the gemfile (gemfiles/*.lock, gitignored,
# never committed); the audit of that lockfile rides on rake compile (rake
# audit:advisories -> bin/audit-advisories), the task every matrix entry
# already runs, so each entry audits the set it actually resolved, in the job
# that installed it.
# bundle-audit exits 1 on an advisory, so a finding fails the matrix entry and
# with it the aggregate "CI OK" job.
#
# Branch protection (ruleset main-protection) requires only the final "CI OK"
# check: keep that job name, and add every new job to its `needs`.
#
# Local equivalent: `bin/check`, which is exactly what the `check` job runs.
# Everything else here needs a runner, compiler or interpreter a dev box lacks
# (.github/CLAUDE.md lists the jobs).
# Gems are cached by ruby/setup-ruby (bundler-cache), keyed on the lockfile or
# gemfile, Ruby version and OS.
#
# Cost shape: a change that touches only prose (`*.md`, `docs/`) runs the
# `workflows` and `check` jobs and skips the rest (the `changes` job decides;
# "CI OK" still reports). A pull request tests the oldest and the newest Ruby
# and the oldest and the newest Rails line; the full generated matrices run on
# every push to main and on a manual run.
jobs:
  # Decides whether the change can affect the gated jobs. Anything it cannot
  # read (API error, a truncated file list, a manual or called run) counts as code.
  changes:
    name: Changes / code or docs only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          code=true
          files=''
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') || files='' ;;
            push)
              files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
                --jq 'if (.files | length) >= 300 then empty else .files[].filename end') || files='' ;;
          esac
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
            code=false
          fi
          printf '%s\n' "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  workflows:
    name: Lint / workflows (actionlint + zizmor) + repo guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: zizmor (workflow security)
        run: pipx run zizmor==1.33.1 --format=github .github/workflows
      # CI/bin/check parity, the agent-read surface, the CLAUDE.md size cap, the AGENTS.md
      # symlink. bin/check runs it too; here it needs no Ruby and no bundle.
      - name: Repository guards
        run: bin/repo-guards

  check:
    # The local gate, unchanged: repo guards, bundle-audit (Gemfile.lock), rake compile,
    # RuboCop, the full RSpec suite, Brakeman, rake smoke. bin/repo-guards fails when this
    # step stops being the bare `bin/check`.
    name: Gate / bin/check (RuboCop + full suite + Brakeman + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ubuntu runners ship gcc/make: no apt build-essential step needed.
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # Not in the Gemfile on purpose (bin/setup installs it the same way locally).
      - run: gem install --no-document bundler-audit
      - run: bin/check

  audit:
    name: Security / bundle-audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler: none
      - run: gem install --no-document bundler-audit
      - name: Check Gemfile.lock against the Ruby advisory database
        run: bundle-audit check --update

  ruby-versions:
    name: Matrix / Ruby versions
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Every maintained CRuby (>= 3.1, the gemspec floor) from cache.ruby-lang.org; head is excluded
    # below (monthly in canary.yml), so new Ruby releases are tested automatically.
    uses: ruby/actions/.github/workflows/ruby_versions.yml@f4d74de05ecaf77cb922e27210650f2838191429 # master, 2026-11-18
    with:
      engine: cruby
      min_version: 3.1

  rubies:
    # The CRuby list the matrix jobs use: every maintained release without head (monthly in
    # canary.yml); a pull request keeps the oldest and the newest.
    name: Matrix / Ruby versions for this run
    needs: ruby-versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - id: pick
        env:
          ALL: ${{ needs.ruby-versions.outputs.versions }}
          EVENT: ${{ github.event_name }}
        run: |
          versions=$(jq -c 'map(select(. != "head")) | sort_by(split(".") | map(tonumber))' <<<"$ALL")
          if [ "$EVENT" = pull_request ]; then
            versions=$(jq -c '[first, last] | unique' <<<"$versions")
          fi
          [ "$(jq length <<<"$versions")" -gt 0 ] || { echo "::error::No Ruby versions to test (got '$ALL')."; exit 1; }
          echo "versions=$versions" | tee -a "$GITHUB_OUTPUT"

  gem-specs:
    name: Gem specs / Ruby ${{ matrix.ruby }}
    needs: rubies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.rubies.outputs.versions) }}
    env:
      # No Rails and no lockfile: resolves on every Ruby, old and new.
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/standalone.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Compile + RSpec (spec/gem without Rails)
        run: bundle exec rake spec:standalone

  native:
    # x86_64 = SSE2 path, aarch64/arm64 = NEON path.
    name: C ext / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux arm64 (gcc), os: ubuntu-24.04-arm }
          - { name: macOS arm64 (clang), os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Compile + RSpec (spec/gem)
        run: bundle exec rake spec:gem
      - name: Packaged gem installs and renders
        run: bundle exec rake smoke

  strict-ext:
    name: C ext / ${{ matrix.cc }} -Werror
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build with warnings as errors
        run: bin/build-ext --cc="$CC" --werror
        env:
          CC: ${{ matrix.cc }}
      - name: RSpec (spec/gem) against that build
        run: bundle exec rake spec:gem
        env:
          SKIP_COMPILE: '1'

  sanitizers:
    name: C ext / ASAN + UBSAN
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build instrumented extension
        run: bin/build-ext --sanitize
      - name: RSpec (spec/gem) with sanitizer runtimes preloaded
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
          export LD_PRELOAD
          bundle exec rspec spec/gem
        env:
          # use_sigaltstack=0: Ruby installs its own signal stack; ASAN's collides with it
          # ("failed to deallocate ... munmap") in a non-instrumented ruby.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1:use_sigaltstack=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  fallback:
    name: Pure Ruby fallback / RUBY2HTML_DISABLE_EXT=1
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: RSpec (spec/gem) without the C extension
        run: bundle exec rake spec:gem
        env:
          RUBY2HTML_DISABLE_EXT: '1'
          SKIP_COMPILE: '1'

  engines:
    name: Engine / ${{ matrix.ruby }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: [jruby, truffleruby] # setup-ruby aliases for the latest releases
    env:
      # rspec + activesupport + htmlbeautifier only: no Rails, no sqlite3.
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/standalone.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # spec:standalone compiles first: on JRuby that builds the Java escaper
      # jar (ext/java), on TruffleRuby extconf.rb no-ops (pure Ruby is faster).
      - name: RSpec (spec/gem without Rails)
        run: bundle exec rake spec:standalone
      # On JRuby this builds and renders from the -java gem (jar inside); on
      # TruffleRuby the pure-Ruby gem.
      - name: Packaged gem installs and renders
        run: bundle exec ruby bin/gem-smoke

  rails-versions:
    name: Matrix / Rails versions
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: versions
        # Every stable Rails MAJOR.MINOR >= 7.2 (the demo app's floor), from rubygems.org,
        # oldest first; a pull request keeps the oldest and the newest line.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          versions=$(ruby bin/rails-versions 7.2)
          if [ "$EVENT" = pull_request ]; then
            versions=$(jq -c '[first, last] | unique' <<<"$versions")
          fi
          echo "versions=$versions" | tee -a "$GITHUB_OUTPUT"

  rails:
    name: Rails ${{ matrix.rails }}
    needs: rails-versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rails: ${{ fromJSON(needs.rails-versions.outputs.versions) }} # edge: monthly in canary.yml
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rake compile
      - name: Resolved versions
        run: bundle list | grep -E ' (rails|view_component|phlex-rails|rspec-rails|sqlite3) '
      - name: RSpec (integration specs)
        run: bundle exec rspec spec/features spec/gem/rails
      # The renderer JRuby and TruffleRuby use, behind the same Rails helpers and handler.
      - name: RSpec (integration specs) without the C extension
        run: bundle exec rspec spec/features spec/gem/rails
        env:
          RUBY2HTML_DISABLE_EXT: '1'

  rails-jruby:
    # The Rails integration on JRuby (Java escaper + pure-Ruby renderer). One Rails line: sqlite3 is
    # a C extension, and activerecord-jdbcsqlite3-adapter, numbered after the Rails line it supports
    # (72.x = Rails 7.2), has no release for a newer line yet. Move RAILS_VERSION up when one ships.
    # gemfiles/rails_common.rb holds view_component below 4.16 on JRuby (it calls Ractor at boot).
    name: Rails 7.2 / JRuby
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILS_VERSION: '7.2'
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: jruby
          bundler-cache: true
      # Builds the Java escaper jar (ext/java); the audit of the resolved set rides on it.
      - run: bundle exec rake compile
      - name: Resolved versions
        run: bundle list | grep -E ' (rails|view_component|phlex-rails|rspec-rails|activerecord-jdbcsqlite3-adapter) '
      - name: RSpec (integration specs)
        run: bundle exec rspec spec/features spec/gem/rails

  package:
    name: Package / build + install on Ruby ${{ matrix.ruby }}
    needs: rubies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.rubies.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Bundler on purpose: the gem must build and install with plain RubyGems.
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: none
      - name: Build gem, install into temp GEM_HOME, render without Rails
        run: ruby bin/gem-smoke

  ci-ok:
    name: CI OK
    if: always()
    # Every job here must pass; nothing is allowed to fail (a docs-only change skips the
    # jobs gated on `changes`, and only then is `skipped` accepted). Ruby head and Rails edge run monthly in
    # canary.yml, where the developerz.ai `improve` checkup picks up what they find.
    needs: [changes, workflows, check, audit, rubies, gem-specs, native, strict-ext, sanitizers, fallback, engines, rails, rails-jruby, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "Results: $RESULTS (code change: $CODE)"
          for r in $RESULTS; do
            if [ "$r" = skipped ] && [ "$CODE" = false ]; then continue; fi
            if [ "$r" != success ]; then
              echo "::error::A required job finished with '$r'"
              exit 1
            fi
          done
