name: Release reminder

# Releases are tag-triggered (release.yml). This weekly check opens (or
# updates) one issue when CHANGELOG.md's [Unreleased] section has entries and
# the last release is older than 60 days, so finished work does not sit unshipped.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Release reminder / unreleased changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: none

      - name: Open or update the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: '60'
        run: |
          if ! bin/changelog-notes Unreleased > unreleased.md 2>/dev/null; then
            echo "CHANGELOG [Unreleased] is empty - nothing to release"
            exit 0
          fi
          last_tag=$(git tag --list 'v*' --sort=-creatordate | head -1)
          if [ -n "$last_tag" ]; then
            last_epoch=$(git log -1 --format=%ct "$last_tag")
          else
            last_epoch=$(git log --reverse --format=%ct | head -1)
          fi
          age_days=$(( ($(date +%s) - last_epoch) / 86400 ))
          echo "Last release: ${last_tag:-none} (${age_days} days ago)"
          if [ "$age_days" -lt "$MAX_AGE_DAYS" ]; then
            exit 0
          fi
          title="Release reminder: unreleased changes waiting"
          {
            echo "The last release (${last_tag:-none}) was ${age_days} days ago and CHANGELOG.md has unreleased entries."
            echo
            echo "To release: bump \`lib/gem/ruby2html/version.rb\`, move [Unreleased] to a version heading, then push a \`vX.Y.Z\` tag (release.yml publishes)."
            echo
            echo "<details><summary>Unreleased</summary>"
            echo
            cat unreleased.md
            echo
            echo "</details>"
          } > body.md
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
          echo "::warning::Unreleased changes and no release for ${age_days} days"
