version: 2
# Weekly, grouped, quiet (owner, 2026-11-26: "not so damn much daily prs"): every ecosystem on
# Monday, minor+patch as ONE pull request per ecosystem, security updates batched into one more per
# ecosystem, majors individually, at most 3 open version-update PRs per ecosystem (security updates
# open when an alert fires, under Dependabot's own separate cap). The developerz.ai maintainer agent
# reviews them and merges on a green "CI OK" (.dz/maintainer/maintainer.yml); it is the only merger
# (no auto-merge workflow).
#
# gemfiles/ needs no entry: the matrix gemfiles have no lockfiles and use
# ~> MAJOR.MINOR.0 / >= constraints, so every CI run resolves the newest
# compatible gems, and CI derives the Ruby and Rails matrices dynamically.
#
# cooldown: in every ecosystem a release must be 14 days old before it is
# proposed, so broken or compromised releases are usually yanked first. No
# group is exempt. Security updates skip the cooldown.
#
# Actions are pinned to a commit SHA (zizmor fails CI otherwise); Dependabot
# moves the SHA and the version comment together. A .ruby-version bump may need
# a newer ruby/setup-ruby than the cooldown has proposed: bump the pin in that PR.
updates:
  - package-ecosystem: bundler
    directory: /
    # The root Gemfile is the demo app's (Ruby >= 3.2), not the gem's. Dependabot pins every
    # bundler resolve to the lowest Ruby the root gemspec allows (3.1, still tested in CI), which
    # overrides the Gemfile's `ruby` line and fails every update. The gemspec declares no
    # dependencies, so excluding it loses nothing.
    exclude-paths: ['ruby2html.gemspec']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    ignore:
      # The Gemfile pins prism ~> 1.6: phlex 2 (via refract) uses Prism::MissingNode, which prism 2
      # removed. Re-enable when phlex/refract support prism 2 (drop the Gemfile pin in the same PR).
      - dependency-name: 'prism'
        update-types: ['version-update:semver-major']
    groups:
      bundler-minor:
        update-types: ['minor', 'patch']
      bundler-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      actions-minor:
        update-types: ['minor', 'patch']
      actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      devcontainers-minor:
        update-types: ['minor', 'patch']
      devcontainers-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      docker-minor:
        update-types: ['minor', 'patch']
      docker-security:
        applies-to: security-updates
        patterns: ['*']
