version: 2
# Weekly, grouped updates. The developerz.ai maintainer agent reviews them and
# merges on a green "CI OK" (.dz/maintainer/maintainer.yml); it is the only merger.
#
# gemfiles/ needs no entry: the matrix gemfiles have no lockfiles and use
# ~> MAJOR.MINOR.0 / >= constraints, so every CI run resolves the newest
# compatible gems, and CI derives the Ruby and Rails matrices dynamically.
#
# cooldown: a release must be 14 days old before it is proposed, so broken or
# compromised releases are usually yanked first. Security updates skip it.
# The dev-tools group (linters, scanners, test tooling) is exempt from the
# bundler cooldown via cooldown.exclude: Dependabot has no per-group cooldown
# key, so exclude is the only lever. A stale linter or scanner is itself a CI
# risk, so those bumps are proposed within days instead of two weeks. The
# exclude list mirrors the dev-tools group patterns below - keep both in sync.
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
      exclude:
        - 'rubocop*'
        - 'brakeman'
        - 'lefthook'
        - 'rake*'
        - 'benchmark-ips'
        - 'capybara'
        - 'faker'
        - 'pry*'
    open-pull-requests-limit: 10
    groups:
      rails:
        patterns: ['rails', 'action*', 'active*', 'railties', 'view_component', 'phlex*', 'slim*', 'rspec*']
      dev-tools:
        patterns: ['rubocop*', 'brakeman', 'lefthook', 'rake*', 'benchmark-ips', 'capybara', 'faker', 'pry*']
      other:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      devcontainers:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
