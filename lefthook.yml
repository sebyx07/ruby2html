# Installed by bin/setup (bundle exec lefthook install).
#
# Commands run with root: apps/ruby2html/ so bundler resolves the app Gemfile
# (the app + gem moved under apps/ruby2html; there is no root bundle). Staged
# files in the root-level bin/ are outside the glob below: lint them with
# ../../bin/rubocop (as bin/check does) or skip the hook once with LEFTHOOK=0.
#
# pre-commit: RuboCop on the staged Ruby files only (safe autocorrect; fixed
#             files are re-staged). Full check: bin/check
# pre-push:   compile + gem specs (`rake spec:gem`, a few seconds), so pushes
#             do not break CI's RuboCop/spec jobs. Skip once: LEFTHOOK=0 git push
pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: '{*.rb,*.rake,*.gemspec,Gemfile,Rakefile,*.gemfile}'
      root: apps/ruby2html/
      run: bundle exec rubocop --force-exclusion --autocorrect {staged_files}
      skip:
        - merge
        - rebase
      stage_fixed: true

pre-push:
  commands:
    gem-specs:
      root: apps/ruby2html/
      run: bundle exec rake spec:gem
