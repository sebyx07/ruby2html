# bundler-audit configuration, read by every `bundle-audit check` run: the root
# `Gemfile.lock` audit and the matrix audits of `gemfiles/*.gemfile.lock`.
#
# Every advisory below is one that upstream patched only in Rails 8.0.5.2 and
# 8.1.4.1 - there is no patched release for the older lines the CI matrix
# deliberately tests:
#
#   * Rails 7.2, the demo app's floor (`gemfiles/rails.gemfile`): every
#     component resolves to 7.2.4, which carries all the advisories below;
#   * Active Support 7.2.4, the newest release that runs on Ruby 3.1, the
#     gem's Ruby floor (`gemfiles/standalone.gemfile`): only
#     GHSA-8474-xrp6-wh69 (safe_constantize DoS) applies there.
#
# Every entry below names the line it covers and what retires it, so a stale
# entry is visible in the file. The other audited resolutions carry none of
# these advisories (the root lock on Rails 8.1.4.1, the Rails 8.0 line on
# 8.0.5.2, the Rails 8.1 line on 8.1.4.1, Active Support 8.1.4.1 on Ruby >=
# 3.3 and on JRuby and TruffleRuby), so the list hides nothing there: auditing
# the root lock with this list switched off reports nothing.
#
# Rules for this list:
#   * only advisories that have no patched release for a line CI tests;
#   * drop an entry as soon as upstream ships a patch for the line it covers;
#   * an entry must never hide a fixable vulnerability: keep the lockfile and
#     the matrix resolutions on patched releases.
#
# `bundle-audit` has no conditional ignore entries - the format is a flat
# list of advisory IDs, read by every run - so this list is global: a Rails
# line that joins the generated matrix unpatched inherits these mutes. That is
# a decision to take per line, not a default: audit the new line's resolution
# with the list switched off before it joins the matrix.
#
# How to re-derive the list after a Rails or Ruby bump. `bundle-audit`
# reports an advisory only for a version it is not patched in, so with the
# ignore list switched off the output is exactly the list still needed:
#
#   printf 'ignore: []\n' > /tmp/no-ignore.yml
#   bundle-audit check --update --gemfile-lock gemfiles/rails.gemfile.lock --config /tmp/no-ignore.yml
#   bundle-audit check --update --gemfile-lock gemfiles/standalone.gemfile.lock --config /tmp/no-ignore.yml
#
# Every advisory those two commands report still needs an entry here; every
# advisory missing from their output is stale and its entry must go. The
# same command on the root lock must report nothing.
