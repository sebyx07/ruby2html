# Toolchain — .ruby-version is the single source of the Ruby pin; the [tools] template below reads it,
# so editing that file alone changes the version `bin/setup`'s `mise install` resolves and installs.
# The box provides `mise` and nothing per-language; never put a version literal here.
[tools]
ruby = "{{ read_file(path='.ruby-version') | trim }}"
