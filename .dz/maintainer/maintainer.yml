# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy for sebyx07/ruby2html
#
# AI-MANAGED. The agent handles issues, pull requests and updates end to end, for everyone:
# outside contributors, collaborators, the owner and the dependency bots. It triages, answers,
# reviews, declines with a reason, merges, and closes what has stalled on its reporter or author.
# A pull request merges once its author says it is ready (out of draft / marked ready for review),
# it has been reviewed and "CI OK" is green. A draft or a "WIP" / "DO NOT MERGE" title is never
# merged. A human is asked only for what `escalate` names, the platform's hardcoded categories
# (security, license, CLA), and two holds on outside contributions: GitHub asks a maintainer to
# approve a first-time contributor's CI run (a repository Actions setting), and changes to CI,
# release or publish automation stay with the owner (the last `triage.non_goals` line).
#
# Each week the `release-due` checkup judges whether a release is needed and opens a release PR when
# so, and merging it IS the release (.github/workflows/release.yml publishes when
# lib/gem/ruby2html/version.rb changes on main). Dependabot PRs merge through this agent only:
# there is no second merger (no GitHub auto-merge workflow) that would skip its review.
#
# The gate is the repository, not this file: CI's aggregate "CI OK" check. Verify the ruleset with
# `gh api repos/sebyx07/ruby2html/rulesets` before trusting any sentence here about it.
version: 1

tone:
  voice: friendly
  language: en

triage:
  skip_project_members: false
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question]
  close_unanswered_repro_after_days: 14
  # Proposals this project will not take (from AGENTS.md "Sharp edges / invariants").
  non_goals:
    - "Caching rendered output or attributes keyed by Object#hash (collisions render another input's output)"
    - "Divergence between the C extension and the pure-Ruby implementation: both must produce byte-identical output"
    - "Escaping off by default, or treating a plain String as html_safe"
    - "A runtime dependency in the gemspec"
    - "Backwards-compatibility shims, dead-code comments, or speculative abstractions"
    - "Hardcoded version lists or benchmark numbers in docs (CI generates the matrices and posts benchmarks)"
    - "Outside changes to CI, release or publish automation (.github/, bin/, Rakefile release tasks, gemspec, Ruby2html::VERSION): owner only. Dependency-bot bumps are not covered: merge those on green"

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [copilot]
  auto_merge: true
  # Every author: the bot's own PRs, the dependency bots', contributors' and project members'.
  # "Ready" is the author's call: a PR merges only once it is out of draft, reviewed and green.
  auto_merge_scope: any
  require_review: true
  # The one required check: ci.yml's aggregate job. Every CI job must pass; nothing is allowed to
  # fail. Ruby head and Rails edge run monthly in canary.yml and are fixed by the `improve` checkup.
  required_checks:
    - "CI OK"
  close_awaiting_author_after_days: 21

review:
  enabled: true
  force: true
  depth: inline
  profile: chill
  request_changes: true
  approval: false
  high_level_summary: true
  learnings: false
  chat_auto_reply: true
  auto_review:
    enabled: true
    incremental: true
    drafts: false
    base_branches: [main]
    ignore_title_keywords: [WIP, "DO NOT MERGE"]
  anti_noise:
    severity_floor: minor
    max_comments: 10
    dedupe: true
  path_filters: []
  path_instructions:
    - path: "ext/ruby2html/**"
      instructions: >-
        C extension hot path. Check GC safety (RB_GC_GUARD after the last use of a VALUE whose
        pointer is read across an allocating call), buffer sizing and re-reading RSTRING_PTR after
        growth, escaping correctness, and that lib/gem/ruby2html/render/pure_ruby.rb got the same
        change (byte-identical output). Speed claims need before/after numbers.
    - path: "lib/gem/ruby2html/render/pure_ruby.rb"
      instructions: >-
        Must stay byte-identical to the C extension (ext/ruby2html). Any rule change needs the
        matching C change and specs in a RenderSpecHelper.describe_each group.
    - path: "lib/gem/ruby2html/rails_components/**"
      instructions: >-
        Escaping is a security boundary: helper output must be html_safe-aware, never
        double-escaped or under-escaped. Template rewrites must insert text only (no newlines).

release:
  # No release manager and no agent-published channels: release.yml owns the whole lane (gem
  # first via RubyGems trusted publishing, then the tag and the GitHub release from CHANGELOG).
  manager: none
  channels: []

escalate:
  # A breaking change asks the owner first: a major version is a maintainer's decision.
  ask_before_acting: [breaking_change]

schedules:
  # Weekly and judged, so a merge never cuts a release (owner, 2026-11-01: "no auto, not dependabot,
  # us developerz.ai AI decides if needed"). One weekday per repo, so the fleet is not hit at once.
  - name: release-due
    days: [fri]
    hours_utc: [3]
    brief_file: .dz/briefs/release-due.md
  # The one exception, so a confirmed security fix does not wait up to a week for the slot above.
  - name: security-release
    days: [mon, tue, wed, thu, sat, sun]
    hours_utc: [2]
    brief_file: .dz/briefs/security-release.md
  - name: health
    days: [mon, tue, wed, thu, fri, sat, sun]
    hours_utc: [7]
    brief_file: .dz/briefs/health.md
  # Monthly: fires every Monday, the brief acts only on the first Monday of the month (day 1-7),
  # after canary.yml's run on the 1st.
  - name: improve
    days: [mon]
    hours_utc: [8]
    brief_file: .dz/briefs/improve.md
